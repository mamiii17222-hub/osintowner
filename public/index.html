<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT Live Stream Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-grid"></div>
  <div class="ambient-glow"></div>

  <header class="navbar">
    <div class="brand">
      <div class="status-pulse"></div>
      <span class="logo-title">OSINT<span class="highlight">.STREAM</span></span>
      <span class="badge">LIVE HYBRID</span>
    </div>

    <div class="nav-controls">
      <div class="key-input-wrapper">
        <input type="password" id="authKeyInput" placeholder="API Key girin (Varsayılan: osint1337)" value="osint1337">
        <button id="saveKeyBtn" class="btn btn-secondary">Bağlan</button>
      </div>
      <button id="refreshBtn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Yenile
      </button>
      <div class="auto-refresh-toggle">
        <label class="switch">
          <input type="checkbox" id="autoRefreshCheckbox" checked>
          <span class="slider"></span>
        </label>
        <span>Oto (3s)</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Toplam Yakalanan Log</span>
        <div class="stat-value" id="totalLogsCount">0</div>
      </div>
      <div class="stat-card">
        <span class="stat-label">Aktif Hedefler / Oyuncular</span>
        <div class="stat-value" id="activePlayersCount">0</div>
      </div>
      <div class="stat-card">
        <span class="stat-label">Son Koordinat İletimi</span>
        <div class="stat-value" id="lastCoordTime">-</div>
      </div>
      <div class="stat-card">
        <span class="stat-label">Discord Entegrasyonu</span>
        <div class="stat-value text-success" id="discordStatus">AKTİF</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">Tümü</button>
          <button class="filter-btn" data-filter="coordinate">📍 Koordinatlar</button>
          <button class="filter-btn" data-filter="chat">💬 Sohbet / Komut</button>
        </div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Oyuncu veya mesaj ara...">
        </div>
      </div>

      <div class="table-container">
        <table class="log-table">
          <thead>
            <tr>
              <th style="width: 130px;">ZAMAN</th>
              <th style="width: 140px;">HEDEF</th>
              <th style="width: 110px;">TİP</th>
              <th>İÇERİK</th>
              <th style="width: 90px; text-align: right;">İŞLEM</th>
            </tr>
          </thead>
          <tbody id="logsTableBody">
            <tr class="empty-row">
              <td colspan="5">Veriler taranıyor veya henüz log bulunamadı...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
